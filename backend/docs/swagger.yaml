basePath: /api/v1
definitions:
  handlers.CreateDepartmentRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  handlers.CreatePositionRequest:
    properties:
      department_id:
        type: string
      description:
        type: string
      name:
        type: string
    required:
    - department_id
    - description
    - name
    type: object
  handlers.CreateWorkflowRequest:
    properties:
      department_id:
        type: string
      description:
        type: string
      name:
        type: string
    required:
    - department_id
    - description
    - name
    type: object
  handlers.CreateWorkflowStepRequest:
    properties:
      name:
        type: string
      position_entity_id:
        type: string
      step_order:
        type: integer
    required:
    - name
    - position_entity_id
    - step_order
    type: object
  handlers.ReorderRequest:
    properties:
      steps:
        items:
          properties:
            id:
              type: string
            step_order:
              type: integer
          required:
          - id
          - step_order
          type: object
        type: array
    required:
    - steps
    type: object
  handlers.sendLoginOTPRequest:
    properties:
      mobile_number:
        type: string
    required:
    - mobile_number
    type: object
  handlers.sendSignupOTPRequest:
    properties:
      full_name:
        type: string
      mobile_number:
        type: string
    required:
    - full_name
    - mobile_number
    type: object
  handlers.verifyOTPRequest:
    properties:
      mobile_number:
        type: string
      otp:
        type: string
    required:
    - mobile_number
    - otp
    type: object
  models.Department:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      positions:
        items:
          $ref: '#/definitions/models.Position'
        type: array
      updated_at:
        type: string
    type: object
  models.DynamicEntry:
    properties:
      created_at:
        type: string
      data:
        type: object
      id:
        type: string
      status:
        type: string
      step_id:
        type: string
      submitted_by:
        type: string
      updated_at:
        type: string
      workflow_id:
        type: string
    type: object
  models.FormField:
    properties:
      created_at:
        type: string
      field_key:
        type: string
      field_order:
        type: integer
      field_type:
        type: string
      id:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      options:
        type: object
      placeholder:
        type: string
      step_id:
        type: string
      updated_at:
        type: string
      validation:
        type: object
    type: object
  models.Position:
    properties:
      created_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.StepRule:
    properties:
      action_then:
        type: object
      condition_if:
        type: object
      created_at:
        type: string
      id:
        type: string
      step_id:
        type: string
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      mobile_number:
        type: string
      position:
        $ref: '#/definitions/models.Position'
      position_id:
        type: string
      session_token:
        type: string
      updated_at:
        type: string
    type: object
  models.Workflow:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      department_id:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      steps:
        items:
          $ref: '#/definitions/models.WorkflowStep'
        type: array
      target_table_type:
        type: string
      updated_at:
        type: string
    type: object
  models.WorkflowStep:
    properties:
      created_at:
        type: string
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/models.FormField'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      position:
        $ref: '#/definitions/models.Position'
      position_id:
        type: string
      rules:
        items:
          $ref: '#/definitions/models.StepRule'
        type: array
      step_order:
        type: integer
      updated_at:
        type: string
      workflow:
        $ref: '#/definitions/models.Workflow'
      workflow_id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
info:
  contact:
    email: support@alngo.org
    name: API Support
  description: This is the backend API for Animal NGO Universal.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Animal NGO Universal Backend API
  version: "1.0"
paths:
  /auth/me:
    get:
      description: Get current authenticated user details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/send-otp/login:
    post:
      consumes:
      - application/json
      description: Send an OTP for user login
      parameters:
      - description: Send Login OTP Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.sendLoginOTPRequest'
      produces:
